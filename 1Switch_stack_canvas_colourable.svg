<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941 952" width="941" height="952" aria-label="4 switch stack icon for Grafana Canvas">
  <style>
    svg { fill: currentColor; }
    .body { fill: inherit; }
    .outline {
      fill: none;
      stroke: #000000;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .detail { fill: #000000; }
    .line {
      fill: none;
      stroke: #000000;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }
  </style>

  <defs>
    <g id="switchUnit">
      <!-- top lid -->
      <polygon class="body" points="90,0 690,0 760,60 20,60"/>
      <polygon class="outline" points="90,0 690,0 760,60 20,60"/>
      <line class="line" x1="28" y1="64" x2="700" y2="64"/>
      <line class="line" x1="714" y1="64" x2="754" y2="64"/>

      <!-- front chassis -->
      <rect class="body" x="5" y="70" width="775" height="115" rx="18" ry="18"/>
      <rect class="outline" x="5" y="70" width="775" height="115" rx="18" ry="18"/>

      <!-- port row blocks -->
      <!-- 8 ports -->
      <g>
        <g transform="translate(52,108)">
          <path class="body" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <path class="outline" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <rect class="detail" x="9" y="13" width="30" height="25" rx="1"/>
        </g>
        <g transform="translate(145,108)">
          <path class="body" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <path class="outline" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 -0.5,-2 -0.5,-2 -0.5,-4 h-11 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <rect class="detail" x="9" y="13" width="30" height="25" rx="1"/>
        </g>
        <g transform="translate(238,108)">
          <path class="body" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <path class="outline" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <rect class="detail" x="9" y="13" width="30" height="25" rx="1"/>
        </g>
        <g transform="translate(331,108)">
          <path class="body" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <path class="outline" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <rect class="detail" x="9" y="13" width="30" height="25" rx="1"/>
        </g>
        <g transform="translate(424,108)">
          <path class="body" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <path class="outline" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <rect class="detail" x="9" y="13" width="30" height="25" rx="1"/>
        </g>
        <g transform="translate(517,108)">
          <path class="body" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <path class="outline" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <rect class="detail" x="9" y="13" width="30" height="25" rx="1"/>
        </g>
        <g transform="translate(610,108)">
          <path class="body" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <path class="outline" d="M0,38 h48 v-26 h-8 c-4,0 -9,-4 -10,-8 v-4 h-12 v4 c-1,4 -6,8 -10,8 h-8 z"/>
          <rect class="detail" x="9" y="13" width="30" height="25" rx="1"/>
        </g>
        <g transform="translate(703,108)">
          <rect class="body" x="0" y="8" width="48" height="38" rx="2"/>
          <rect class="outline" x="0" y="8" width="48" height="38" rx="2"/>
          <rect class="detail" x="18" y="18" width="12" height="18" rx="1"/>
        </g>
      </g>

      <!-- right-side indicator circles -->
      <circle class="body" cx="746" cy="108" r="11"/>
      <circle class="outline" cx="746" cy="108" r="11"/>
      <circle class="body" cx="746" cy="145" r="11"/>
      <circle class="outline" cx="746" cy="145" r="11"/>

      <!-- bottom shadow/feet details -->
      <rect class="detail" x="68" y="178" width="110" height="6" rx="2"/>
      <rect class="detail" x="285" y="178" width="110" height="6" rx="2"/>
      <rect class="detail" x="500" y="178" width="110" height="6" rx="2"/>
      <rect class="detail" x="675" y="178" width="80" height="6" rx="2"/>
    </g>
  </defs>

  <!-- One stacked switch -->
  <g transform="translate(76,478)"><use href="#switchUnit"/></g>
</svg>
